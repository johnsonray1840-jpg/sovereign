; Production PHP Configuration for Sovereign Vault Capital
display_errors = Off
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
memory_limit = 512M
post_max_size = 256M
upload_max_filesize = 256M
zlib.output_compression = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
